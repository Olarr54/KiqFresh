[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

# Clean tracking URL: /track?token=... → /track.html?token=...
[[redirects]]
  from   = "/track"
  to     = "/track.html"
  status = 200
  query  = { token = ":token" }

# Blog post pages — :slug appended to function path so event.path contains it
[[redirects]]
  from   = "/blog/:slug"
  to     = "/.netlify/functions/blog-render/:slug"
  status = 200

# Custom 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains"
    Content-Security-Policy      = "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.web3forms.com https://*.supabase.co; img-src 'self' data: blob:; form-action https://api.web3forms.com; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'"

# Relaxed CSP for the CMS editor (needs external scripts from Decap + Netlify Identity)
[[headers]]
  for = "/admin/cms/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://netlify-cdp-proxy.netlify.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com data:; connect-src 'self' https://api.netlify.com https://*.netlify.com https://github.com https://api.github.com; img-src 'self' data: blob: https:; frame-src https://identity.netlify.com; frame-ancestors 'none'"
