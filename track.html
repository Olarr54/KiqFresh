<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — KiqFresh</title>
  <meta name="description" content="Track the status of your shoe cleaning order with KiqFresh.">
  <link rel="icon" type="image/jpeg" href="/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { background: var(--cream); padding-top: 68px; }

    .page-wrap {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1.25rem 5rem;
    }

    .track-card {
      width: 100%;
      max-width: 480px;
    }

    .track-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      letter-spacing: 0.05em;
      line-height: 0.9;
      color: var(--orange);
      text-shadow: 5px 5px 0 var(--black);
      margin-bottom: 0.25rem;
    }

    .track-sub {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border: 3.5px solid var(--black);
      border-radius: 20px;
      box-shadow: 6px 6px 0 var(--black);
      overflow: hidden;
    }

    .card-header {
      background: var(--orange);
      border-bottom: 3.5px solid var(--black);
      padding: 1.5rem 2rem;
    }

    .card-header .label {
      font-family: 'Bangers', cursive;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: var(--black);
      opacity: 0.6;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .card-header h2 {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--black);
      line-height: 1;
    }

    .card-header .service {
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(0,0,0,0.55);
      margin-top: 0.35rem;
    }

    .card-body { padding: 2rem; }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 0; }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      position: relative;
    }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 14px;
      top: 38px;
      width: 3px;
      height: 30px;
      background: #ddd;
      border-radius: 2px;
    }

    .step.done:not(:last-child)::after  { background: var(--black); }
    .step.active:not(:last-child)::after { background: rgba(165,210,255,0.4); }

    .dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid #ddd;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 900;
      color: #bbb;
      background: white;
      margin: 4px 0 32px;
      position: relative;
      z-index: 1;
    }

    .step.done .dot {
      border-color: var(--black);
      background: var(--black);
      color: white;
    }

    .step.active .dot {
      border-color: var(--orange);
      border-width: 3px;
      background: var(--orange);
      color: var(--black);
      box-shadow: 3px 3px 0 var(--black);
    }

    .step-text { padding: 3px 0 32px; flex: 1; }

    .step-name {
      font-size: 0.88rem;
      font-weight: 900;
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .step.done .step-name   { color: #999; }
    .step.active .step-name {
      color: var(--black);
      font-size: 0.95rem;
    }

    .step-desc {
      font-size: 0.82rem;
      color: #666;
      margin-top: 0.3rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .updated {
      font-size: 0.75rem;
      font-weight: 700;
      color: #aaa;
      border-top: 2px solid #eee;
      padding-top: 1.25rem;
      margin-top: 0.5rem;
    }

    .status-msg {
      padding: 2.5rem 2rem;
      color: #777;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 700;
    }
    .status-msg a { color: var(--black); font-weight: 900; }

    .book-cta {
      margin-top: 1.5rem;
      text-align: center;
    }
    .book-cta a {
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: #888;
      text-decoration: none;
      font-weight: normal;
    }
    .book-cta a:hover { color: var(--black); }

    @media(max-width:500px) {
      .page-wrap { padding: 3rem 1rem 4rem; }
      .card-body { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<nav id="main-nav">
  <a href="/" class="nav-logo">
    <img src="/logo.jpeg" class="nav-logo-img" alt="KiqFresh logo">
  </a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/booking.html" class="nav-cta">Book Now</a></li>
  </ul>
  <button class="nav-burger" id="burger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page-wrap">
  <div class="track-card">
    <h1 class="track-title">Your Order</h1>
    <p class="track-sub">KiqFresh &mdash; Shoe Cleaning Reading</p>

    <div class="card" id="card">
      <div class="status-msg" id="loading">Loading your order…</div>
    </div>

    <div class="book-cta">
      <a href="/">Back to kiqfresh.net</a>
    </div>
  </div>
</div>

<script>
  const STEPS = [
    { key: 'purchase_complete', name: 'Purchase Completed',   desc: 'Payment received — we\'ll be in touch shortly.' },
    { key: 'received',          name: 'Shoes Received',       desc: 'Your trainers are safe with us and ready to be cleaned.' },
    { key: 'cleaning',          name: 'Cleaning in Progress', desc: 'Our team is working on your kicks right now.' },
    { key: 'complete',          name: 'Clean Complete',       desc: 'Your trainers are looking fresh and ready for you.' },
    { key: 'returned',          name: 'Returned to You',      desc: 'All done — enjoy your fresh kicks!' },
  ];

  function getToken() {
    return new URLSearchParams(window.location.search).get('token');
  }

  function isValidUUID(s) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s);
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderError(msg) {
    document.getElementById('card').innerHTML =
      `<div class="status-msg"><p>${msg}</p><p style="margin-top:0.75rem;font-size:0.85rem"><a href="/">Visit kiqfresh.net</a></p></div>`;
  }

  function renderOrder(order) {
    const currentIdx = STEPS.findIndex(s => s.key === order.status);
    const firstName = order.customer_name ? order.customer_name.split(' ')[0] : '';
    const stepsHtml = STEPS.map((step, i) => {
      const cls = i < currentIdx ? 'done' : i === currentIdx ? 'active' : '';
      const dot = i < currentIdx ? '&#10003;' : String(i + 1);
      return `
        <div class="step ${cls}">
          <div class="dot">${dot}</div>
          <div class="step-text">
            <div class="step-name">${esc(step.name)}</div>
            ${cls === 'active' ? `<div class="step-desc">${esc(step.desc)}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const updated = new Date(order.updated_at).toLocaleString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
    });

    document.getElementById('card').innerHTML = `
      <div class="card-header">
        ${firstName ? `<div class="label">Hey ${esc(firstName)} &mdash;</div>` : ''}
        <h2>Order Status</h2>
        <div class="service">${esc(order.service_type || 'Shoe Cleaning Service')}</div>
      </div>
      <div class="card-body">
        <div class="steps">${stepsHtml}</div>
        <div class="updated">Last updated: ${updated}</div>
      </div>`;
  }

  async function init() {
    const token = getToken();
    if (!token || !isValidUUID(token)) { renderError('This tracking link is invalid.'); return; }
    try {
      const res = await fetch(`/.netlify/functions/track?token=${encodeURIComponent(token)}`);
      if (res.status === 404) { renderError('Order not found. Check the link you received.'); return; }
      if (!res.ok)            { renderError('Something went wrong. Try again in a moment.'); return; }
      renderOrder(await res.json());
    } catch {
      renderError('Could not load your order. Check your connection and try again.');
    }
  }

  // Mobile nav
  document.getElementById('burger').addEventListener('click', function() {
    document.querySelector('.nav-links').classList.toggle('open');
  });

  init();
</script>
</body>
</html>
